services:
  db:
    image: postgres:16-alpine
    container_name: vinyl_nuxt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vinyl
      POSTGRES_PASSWORD: vinyl
      POSTGRES_DB: vinyl
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vinyl -d vinyl']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
